<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>


    <!-- utility classes 
    
    
    
    -->
    <div class="d-flex flex-column justify-content-center align-items-center w-100 mt-5">
        <div class="w-50 border p-5 shadow-lg">
        <h2 class="text-center text-info">Register Form</h2>
        <form action="">
            <label for="" class="form-label">Username:</label>
            <input type="text" class="form-control">
            <label for="" class="form-label">Email"</label>
            <input type="email" class="form-control">
            <label for="" class="form-label">Password:</label>
            <input type="password" class="form-control">

            <div class="form-check">
                <input type="radio" id="male" name="Gender" class="form-check-input">
                <label for="male" class="form-check-label">Male</label>
            </div>
            <div class="form-check">
                <input type="radio" id="female" name="Gender" class="form-check-input">
                <label for="female" class="form-check-label">Female</label>
            </div>

            <div class="form-check">
                <input type="checkbox" class="form-check-input">
                <label for="" class="form-label">i accept the terms and condition.</label>
            </div>




            <div class="d-grid">
                <button class="btn btn-primary">Save</button>
            </div>
        </form>
        </div>
    </div>
    
    <button class="btn btn-success">Click</button>
    <button class="btn btn-warning">update</button>
    <button class="btn btn-danger">delete</button>
    <button class="btn btn-outline-primary">click</button>
    <button class="btn-close"></button>
    <button class="spinner-border text-danger"></button>
    <button class="spinner-grow"></button>
    <button class="btn btn-primary">Loading....<span class="spinner-border"></span></button>
    
    <div class="btn-group">
        <button class="btn btn-primary">login</button>
        <button class="btn btn-primary">logout</button>
        <button class="btn btn-primary">logout</button>
        <button class="btn btn-primary">logout</button>
    </div>




</body>
</html>
